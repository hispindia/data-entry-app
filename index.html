<!DOCTYPE html>
<html>

<head>
    <title>IPPF Business Portal</title>
</head>

<body>
    <!--Constants-->
    <!-- <script src="assets/js/constant.js"></script>
    <script src="assets/js/config.js"></script> -->

    <script type="module">
        import { getOrganisationUnits } from './assets/js/api/func.js';
        import { getUserConfig } from './assets/js/forms/config.js';
        import { tei } from './assets/js/constant.js';

        async function fetchData() {
            try {
                localStorage.clear();
                const user = await getUserConfig();
                tei.disabled = user.disabled;
                window.localStorage.setItem('userDisabled', user.disabled);
                window.localStorage.setItem('hideReporting', user.hideReporting);

                if (user.organisationUnits && user.organisationUnits.length > 0) {
                    const resOUGroup = await getOrganisationUnits('mwQWyy8TGZv')
                    const orgUnitList = []
                    resOUGroup.organisationUnits.forEach(ou => {
                    if (user.organisationUnits.some(mainOU => ou.path.includes(mainOU.id)))
                    orgUnitList.push(ou);
                    })
                    if (orgUnitList.length > 1) {
                    // window.location.href = '../../apps/IPPF-BPR-App/members-association.html';
                    window.location.href = './members-association.html';
                    }
                    // else window.location.href = '../../apps/IPPF-BPR-App/1.1-organization-details-au.html';
                    else window.location.href = './1.1-organization-details-au.html';
                }
            } catch (error) {
                console.error("OOPS!! Page not found.", error);
            }
        }
        fetchData();
    </script>
</body>

</html>
